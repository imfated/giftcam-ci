name: Build GiftCam IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 180

    steps:
      # Actions is disabled on the fork itself, so this workflow lives in
      # giftcam-ci and pulls the fork (public) which already contains the patch.
      - name: Clone Telegram-iOS fork
        run: git clone --depth 1 https://github.com/imfated/DoomGram.git .

      - name: Init submodules
        run: |
          sed -i '' 's|url=\.\./|url=https://github.com/TelegramMessenger/|g' .gitmodules
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1

      - name: Apply GiftCam patches
        run: git apply patches/*.patch

      - name: Apply DoomGram name and icon
        run: python3 giftcam/apply_branding.py

      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain

      - name: Free disk space
        run: |
          sudo rm -rf /Applications/Xcode_1*.app || true
          sudo rm -rf "$ANDROID_HOME" /usr/local/share/dotnet ~/Library/Android || true
          df -h /

      - name: Generate configuration
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          mkdir -p build-input
          cat > build-input/configuration.json <<EOF
          {"bundle_id":"ph.telegra.Telegraph","api_id":"${API_ID}","api_hash":"${API_HASH}","team_id":"C67CF9S4VU","is_internal_build":"true","is_appstore_build":"false","appstore_id":"0","app_specific_url_scheme":"tg","premium_iap_product_id":"","enable_siri":false,"enable_icloud":false}
          EOF
          cat build-input/configuration.json

      - name: Setup signing identity and refresh profiles
        run: |
          set -e
          KEYCHAIN=build.keychain
          KEYCHAIN_PASSWORD=temp123
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security import build-system/fake-codesigning/certs/SelfSigned.p12 -k "$KEYCHAIN" -P "" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          IDENTITY=$(openssl pkcs12 -in build-system/fake-codesigning/certs/SelfSigned.p12 -passin pass: -nokeys -legacy | openssl x509 -noout -subject -nameopt oneline | sed -n 's/.*CN *= *//p' | cut -d, -f1)
          echo "Signing identity: $IDENTITY"
          cd build-system/fake-codesigning/profiles
          for f in *.mobileprovision; do
            security cms -D -i "$f" -o /tmp/giftcam-profile.plist
            plutil -replace ExpirationDate -date "2027-10-30T17:06:30Z" /tmp/giftcam-profile.plist
            plutil -remove DER-Encoded-Profile /tmp/giftcam-profile.plist || true
            security cms -S -k "$KEYCHAIN" -N "$IDENTITY" -i /tmp/giftcam-profile.plist -o "$f"
          done

      - name: Restore Bazel cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tg-bazel-cache
          key: bazel-giftcam-${{ github.run_id }}
          restore-keys: bazel-giftcam-

      - name: Build IPA
        run: |
          python3 build-system/Make/Make.py \
            --cacheDir="$RUNNER_TEMP/tg-bazel-cache" \
            --overrideXcodeVersion \
            build \
            --configurationPath=build-input/configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber=${{ github.run_number }} \
            --outputBuildArtifactsPath=build-output

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GiftCam-IPA
          path: build-output/**/*.ipa
